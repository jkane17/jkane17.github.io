name: Validate and deploy site

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Allow re-running a deploy by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Let an in-progress deploy finish rather than cancelling it part way
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install mdBook
        shell: bash
        run: |
          MDBOOK_VERSION=$(cat .mdbook-version)
          curl --fail --location --retry 3 "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz
          sudo mv mdbook /usr/local/bin

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Pillow renders the blog posts' link-preview images
      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run validation tests
        run: python3 -m unittest discover -s tests

      # Builds pages and blog books into _site/ (the same script local_test.sh uses).
      # Only _site/ is published, not sources, scripts or repo config.
      - name: Build site
        run: python3 build.py

      - name: Validate generated site
        run: python3 validate_site.py

      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
