name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  # Allow re-running a deploy by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish rather than cancelling it part way
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install mdBook
        run: |
          MDBOOK_VERSION=0.5.2
          curl -L https://github.com/rust-lang/mdBook/releases/download/v$MDBOOK_VERSION/mdbook-v$MDBOOK_VERSION-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          sudo mv mdbook /usr/local/bin

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Pillow renders the blog posts' link-preview images
      - name: Install Python dependencies
        run: pip install pillow

      # Builds pages and blog books into _site/ (the same script local_test.sh uses).
      # Only _site/ is published, not sources, scripts or repo config.
      - name: Build site
        run: python3 build.py

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
